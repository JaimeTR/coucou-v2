name: Mobile (Coucou v2)

# Tests, type-checks and bundles the phone app (iPhone and Android, Expo) on
# every pull request that touches mobile/. It never builds the store apps and
# never publishes anything: those come from EAS (see mobile/README.md).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The web export compiles every screen with Metro: it catches what the
      # type-checker cannot (a missing package, a bad import).
      - run: npx expo export --platform web
