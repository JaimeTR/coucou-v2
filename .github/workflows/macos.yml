name: macOS (Coucou v2)

# Builds and tests the Tauri app on a Mac: the same code as Windows and Linux,
# with the macOS platform layer in windows/src-tauri/src/platform/macos.rs. It is
# the only place that port is compiled, so a push or pull request that touches
# windows/ runs it. It never publishes anything; run it by hand to get the .dmg.
#
# (The native Swift app in NotchBuddy/ has its own workflow, build.yml.)

on:
  workflow_dispatch:
  # The Mac is a first-class target now (same app as Windows): every change to it is compiled here.
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: macos-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Front-end tests
        run: npm test

      # The app bundles target/release/coucou-hook as a resource, and its build
      # script refuses to run until that file exists.
      - name: Rust tests
        run: |
          cargo build --release -p coucou-hook
          cargo test --workspace

      - name: Build the app
        run: npm run pack

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Coucou-macOS
          path: windows/release/Coucou-macOS-*
          retention-days: 3
