<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ajustes — Coucou</title>
  </head>
  <body class="settings-window" style="background: #0b0c0e; color: #f5f6f8">
    <header class="titlebar" data-tauri-drag-region>
      <span class="titlebar-title" data-tauri-drag-region>Ajustes — Coucou</span>
      <div class="titlebar-buttons">
        <button id="tb-min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button id="tb-max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 10 10" width="10" height="10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
        <button id="tb-close" class="close" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
    </header>
    <div id="settings-root"><p style="padding: 24px">Cargando…</p></div>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
